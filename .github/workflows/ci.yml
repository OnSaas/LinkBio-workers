# LinkBio-workers — lint, typecheck, test, worker build.
# Production deploy stays in deploy.yml (push to main/master).

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Guard registry
        run: |
          echo "registry=$(npm config get registry)"
          if npm config get registry | grep -Eqi 'tencentyun|tencentcloud'; then
            echo "Refusing Tencent internal npm mirror in CI"
            exit 1
          fi

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build worker
        run: npm run build:worker

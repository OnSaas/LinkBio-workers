# LinkBio-workers — Next.js (OpenNext) → Cloudflare Workers
#
# Secrets: CF_API_TOKEN / CF_ACCOUNT_ID (or CLOUDFLARE_*)
# Vars/Secrets: BIO_KV_ID (required), BIO_KV_PREVIEW_ID (optional)
# Worker secrets stay on Cloudflare (CLI/Dashboard): ADMIN_PASSWORD, SESSION_SECRET
# Do not set npm registry to mirrors.tencentyun.com — GitHub-hosted runners cannot resolve it.

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: never
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Guard registry
        run: |
          echo "registry=$(npm config get registry)"
          if npm config get registry | grep -Eqi 'tencentyun|tencentcloud'; then
            echo "Refusing Tencent internal npm mirror in CI"
            exit 1
          fi

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Inject KV ids
        env:
          BIO_KV_ID: ${{ vars.BIO_KV_ID || secrets.BIO_KV_ID }}
          BIO_KV_PREVIEW_ID: ${{ vars.BIO_KV_PREVIEW_ID || secrets.BIO_KV_PREVIEW_ID }}
        run: |
          set -euo pipefail
          test -n "${BIO_KV_ID:-}" || { echo "BIO_KV_ID missing"; exit 1; }
          PREVIEW="${BIO_KV_PREVIEW_ID:-$BIO_KV_ID}"
          sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/${BIO_KV_ID}/" wrangler.toml
          sed -i "s/REPLACE_WITH_YOUR_KV_PREVIEW_ID/${PREVIEW}/" wrangler.toml

      - name: Build worker
        run: npm run build:worker

      - name: Deploy
        run: npx wrangler deploy
